<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pixel Font Creator</title>
    <!-- OpenType.js library for TTF generation -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0d0f14;
            --bg-deep: #08090d;
            --panel-bg: #14171f;
            --panel-raised: #191d27;
            --border-color: #262b38;
            --border-glow: #323a4d;

            /* Signature phosphor accents */
            --accent-color: #4ade80;      /* phosphor green */
            --accent-hover: #22c55e;
            --accent-glow: rgba(74, 222, 128, 0.55);
            --amber: #fbbf24;             /* amber CRT */
            --amber-glow: rgba(251, 191, 36, 0.5);
            --magenta: #f472b6;
            --cyan: #22d3ee;

            --text-main: #eef2f6;
            --text-muted: #8892a6;
            --grid-line: #20242f;
            --cell-bg: #0a0c11;
            --success-color: #4ade80;
            --warning-color: #fbbf24;

            --display: 'Space Grotesk', system-ui, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--display);
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 0%, rgba(74, 222, 128, 0.06), transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(251, 191, 36, 0.05), transparent 45%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh; /* Default for desktop */
            overflow: hidden;
        }

        /* Top Navigation */
        header {
            background: linear-gradient(180deg, var(--panel-raised), var(--panel-bg));
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 20px -8px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .logo {
            font-family: var(--mono);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .logo svg { color: var(--accent-color); filter: drop-shadow(0 0 6px var(--accent-glow)); }
        .logo .blink {
            display: inline-block;
            width: 0.55rem; height: 1.1rem;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
            margin-left: 0.15rem;
            animation: caret 1.1s steps(1) infinite;
        }
        @keyframes caret { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .logo .blink { animation: none; } }
        
        .controls { display: flex; gap: 0.6rem; align-items: center; }
        
        .control-group {
            display: flex;
            align-items: center;
            background: var(--bg-deep);
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            height: 36px;
            transition: border-color 0.15s;
        }
        .control-group:focus-within { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-glow); }

        .control-group label {
            margin: 0 0.5rem; font-size: 0.7rem; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; gap: 0.35rem; font-weight: 600;
        }
        .control-group input[type="number"] {
            background: transparent; border: none; color: var(--accent-color); width: 34px; text-align: center;
            font-family: var(--mono); font-weight: 700; font-size: 1rem; outline: none;
        }
        .control-group input[type="checkbox"] { cursor: pointer; accent-color: var(--accent-color); width: 15px; height: 15px; }

        button {
            background-color: var(--accent-color);
            color: #06210f; border: none; padding: 0.5rem 0.9rem; border-radius: 0.4rem;
            font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
            font-family: var(--mono); font-size: 0.8rem; height: 36px; letter-spacing: -0.01em;
            display: flex; align-items: center; gap: 0.4rem;
        }
        button:hover { background-color: var(--accent-hover); box-shadow: 0 0 14px var(--accent-glow); }
        button:active { transform: translateY(1px) scale(0.98); }
        button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        button.secondary {
            background-color: var(--panel-raised); border: 1px solid var(--border-color); color: var(--text-muted);
        }
        button.secondary:hover { background-color: var(--border-color); color: var(--text-main); box-shadow: none; }
        button.success { background-color: var(--success-color); color: #06210f; }
        button.success:hover { background-color: #22c55e; box-shadow: 0 0 14px var(--accent-glow); }
        button.warning { background-color: var(--amber); color: #2a1c00; }
        button.warning:hover { background-color: #f59e0b; box-shadow: 0 0 14px var(--amber-glow); }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Panel: All Characters Preview */
        .sidebar-left {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 0.85rem 1rem;
            font-family: var(--mono);
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header::before {
            content: "▸";
            color: var(--accent-color);
            margin-right: 0.5rem;
            filter: drop-shadow(0 0 4px var(--accent-glow));
        }

        .char-grid {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .char-card {
            background-color: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 0.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem 0.4rem;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
        }
        .char-card:hover { border-color: var(--border-glow); transform: translateY(-2px); }
        .char-card.active {
            border-color: var(--accent-color);
            background-color: rgba(74, 222, 128, 0.08);
            box-shadow: 0 0 0 1px var(--accent-color), 0 0 16px -2px var(--accent-glow);
        }
        .char-card span {
            font-size: 0.68rem; color: var(--text-muted); margin-bottom: 0.35rem;
            font-family: var(--mono); font-weight: 500; white-space: nowrap;
        }
        .char-card.active span { color: var(--accent-color); }
        .char-card canvas { background: transparent; image-rendering: pixelated; width: 100%; max-width: 40px; }

        /* Center Panel: Editor */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            padding: 2rem;
            overflow-y: auto;
        }

        .editor-title { 
            margin-bottom: 1.5rem; 
            font-size: 0.8rem; 
            font-weight: 600; 
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted); 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            flex-wrap: wrap;
            justify-content: center;
        }
        .editor-title .char-badge {
            background: var(--panel-raised);
            padding: 0.3rem 0.85rem; border-radius: 0.5rem;
            border: 1px solid var(--border-glow);
            font-family: var(--mono); font-size: 1rem; font-weight: 700;
            letter-spacing: 0; text-transform: none;
            color: var(--amber);
            text-shadow: 0 0 10px var(--amber-glow);
        }

        .editor-toolbar {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tool-btn { padding: 0.4rem 0.7rem; font-size: 0.72rem; }

        .drawing-grid {
            display: grid;
            background-color: var(--grid-line);
            gap: 1px;
            padding: 1px;
            border: 1px solid var(--border-glow);
            border-radius: 0.4rem;
            box-shadow:
                0 20px 40px -12px rgba(0, 0, 0, 0.7),
                inset 0 0 0 1px rgba(255,255,255,0.02);
            user-select: none;
            touch-action: none; /* Prevents screen scrolling while drawing on mobile */
        }

        .cell {
            background-color: var(--cell-bg);
            /* Size controlled via CSS variable for responsive scaling */
            width: var(--cell-size, 32px);
            height: var(--cell-size, 32px);
            cursor: crosshair;
            transition: background-color 0.05s, box-shadow 0.05s;
        }
        .cell:hover { background-color: #161a24; }
        .cell.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow), inset 0 0 4px rgba(255,255,255,0.4);
        }

        /* Right Panel: Custom Text & Export */
        .sidebar-right {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .test-section {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 0.4rem;
            color: var(--text-main);
            padding: 0.75rem;
            resize: none;
            font-family: var(--mono);
            font-size: 0.85rem;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-glow); }

        .preview-container {
            flex: 1;
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(rgba(74,222,128,0.035) 1px, transparent 1px);
            background-size: 100% 3px;
            border: 1px solid var(--border-color);
            border-radius: 0.4rem;
            padding: 1rem;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        
        #textPreviewCanvas { image-rendering: pixelated; }

        .export-section {
            padding: 1.25rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .export-section .export-label {
            font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.35rem;
        }
        
        .export-btn { width: 100%; padding: 0.7rem; font-size: 0.82rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 5px; border: 2px solid var(--bg-deep); }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 900px) {
            body {
                height: auto; /* Allow native scrolling */
                overflow-y: auto;
            }
            .main-container {
                flex-direction: column;
                overflow: visible;
            }
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            .logo { justify-content: center; }
            .sidebar-left, .sidebar-right {
                width: 100%;
                border: none;
            }
            .sidebar-left {
                border-bottom: 1px solid var(--border-color);
                height: 350px; /* Fixed scrollable block for mobile */
            }
            .sidebar-right { border-top: 1px solid var(--border-color); }
            .editor { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
            pixelfont<span style="color:var(--accent-color)">.studio</span><span class="blink"></span>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>W</label>
                <input type="number" id="fontWidth" value="5" min="2" max="32">
                <label style="margin-left:0;">H</label>
                <input type="number" id="fontHeight" value="7" min="2" max="32">
            </div>

            <div class="control-group">
                <label title="Includes characters 128-255">
                    <input type="checkbox" id="extendedAsciiToggle" onchange="toggleExtendedAscii()"> Extended ASCII
                </label>
            </div>

            <button class="secondary" onclick="resetFont()">New / Clear</button>
            <button class="secondary" onclick="saveProject()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save
            </button>
            <button class="secondary" onclick="document.getElementById('fileInput').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Load
            </button>
            <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadProject(event)">
        </div>
    </header>

    <div class="main-container">
        <!-- Left Sidebar: Character Selector -->
        <div class="sidebar-left">
            <div class="panel-header">
                <span id="charPanelTitle">ASCII 32-126</span>
            </div>
            <div class="char-grid" id="charGrid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Center: Editor -->
        <div class="editor">
            <div class="editor-title">
                Editing <div class="char-badge" id="currentCharBadge">'A' (65)</div>
            </div>
            <div class="editor-toolbar">
                <button class="secondary tool-btn" onclick="undo()" title="Undo (Ctrl+Z)">↩ Undo</button>
                <button class="secondary tool-btn" onclick="clearGlyph()" title="Clear this glyph">✕ Clear</button>
                <button class="secondary tool-btn" onclick="copyGlyph()" title="Copy glyph">⧉ Copy</button>
                <button class="secondary tool-btn" onclick="pasteGlyph()" title="Paste glyph">⤓ Paste</button>
                <button class="secondary tool-btn" onclick="invertGlyph()" title="Invert filled/empty">◐ Invert</button>
            </div>
            <div class="drawing-grid" id="drawingGrid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Right Sidebar: Test & Export -->
        <div class="sidebar-right">
            <div class="panel-header">Custom Text Preview</div>
            <div class="test-section">
                <textarea id="testInput" placeholder="Type here to test your font...">A B C&#10;Hello World!&#10;É ñ ¿</textarea>
                <div class="preview-container">
                    <canvas id="textPreviewCanvas"></canvas>
                </div>
            </div>
            <div class="export-section">
                <div class="export-label">Export font as</div>
                <button class="export-btn warning" onclick="exportToTtf()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download Vector TTF (.ttf)
                </button>
                <button class="export-btn success" onclick="exportToCpp()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download C++ Header (.h)
                </button>
                <button class="export-btn success" onclick="exportToBdf()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download BDF (.bdf)
                </button>
                <button class="export-btn success" onclick="exportToPsf()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download PSF2 (.psf)
                </button>
            </div>
        </div>
    </div>

    <script>
        let fontWidth = 5;
        let fontHeight = 7;
        const START_CHAR = 32;
        let END_CHAR = 126;
        let NUM_CHARS = END_CHAR - START_CHAR + 1;
        
        let fontData = [];
        let currentChar = 65; 
        
        let isDrawing = false;
        let drawMode = 1; 

        const drawingGrid = document.getElementById('drawingGrid');
        const charGrid = document.getElementById('charGrid');
        const currentCharBadge = document.getElementById('currentCharBadge');
        const testInput = document.getElementById('testInput');
        const textPreviewCanvas = document.getElementById('textPreviewCanvas');
        const charPanelTitle = document.getElementById('charPanelTitle');
        const extendedAsciiToggle = document.getElementById('extendedAsciiToggle');
        const ctxPreview = textPreviewCanvas.getContext('2d');

        // Dynamic Resize Logic for Mobile grids
        function updateCellSize() {
            const padding = 64; 
            const availableWidth = window.innerWidth <= 900 ? window.innerWidth - padding : 600;
            const maxCellSize = Math.floor(availableWidth / fontWidth);
            const cellSize = Math.min(32, maxCellSize);
            drawingGrid.style.setProperty('--cell-size', `${Math.max(8, cellSize)}px`);
        }
        window.addEventListener('resize', updateCellSize);

        function initFont() {
            fontWidth = parseInt(document.getElementById('fontWidth').value) || 5;
            fontHeight = parseInt(document.getElementById('fontHeight').value) || 7;
            
            const isExtended = extendedAsciiToggle.checked;
            END_CHAR = isExtended ? 255 : 126;
            NUM_CHARS = END_CHAR - START_CHAR + 1;
            
            fontData = Array.from({ length: NUM_CHARS }, () => 
                Array.from({ length: fontHeight }, () => Array(fontWidth).fill(0))
            );

            refreshUI();
        }

        function resetFont() {
            if(confirm("This will clear all your drawings. Are you sure?")) initFont();
        }

        function toggleExtendedAscii() {
            const isExtended = extendedAsciiToggle.checked;
            const oldNumChars = NUM_CHARS;
            END_CHAR = isExtended ? 255 : 126;
            NUM_CHARS = END_CHAR - START_CHAR + 1;

            if (isExtended && fontData.length < NUM_CHARS) {
                for (let i = oldNumChars; i < NUM_CHARS; i++) {
                    fontData.push(Array.from({ length: fontHeight }, () => Array(fontWidth).fill(0)));
                }
            } else if (!isExtended && fontData.length > NUM_CHARS) {
                if (confirm("Disabling Extended ASCII will delete your drawings for characters 127-255. Are you sure?")) {
                    fontData = fontData.slice(0, NUM_CHARS);
                    if (currentChar > END_CHAR) currentChar = 65;
                } else {
                    extendedAsciiToggle.checked = true;
                    END_CHAR = 255;
                    NUM_CHARS = END_CHAR - START_CHAR + 1;
                    return; 
                }
            }
            refreshUI();
        }

        function refreshUI() {
            charPanelTitle.innerText = `ASCII 32-${END_CHAR}`;
            setupCharGrid();
            setupDrawingGrid();
            selectChar(currentChar);
            updateTextPreview();
        }

        function setupCharGrid() {
            charGrid.innerHTML = '';
            for(let i = 0; i < NUM_CHARS; i++) {
                let asciiCode = i + START_CHAR;
                let charStr = asciiCode === 32 ? "SPACE" : asciiCode === 127 ? "DEL" : String.fromCharCode(asciiCode);
                
                const card = document.createElement('div');
                card.className = 'char-card';
                card.id = `char-card-${asciiCode}`;
                card.onclick = () => selectChar(asciiCode);

                const label = document.createElement('span');
                label.innerText = charStr;

                const canvas = document.createElement('canvas');
                canvas.width = fontWidth; canvas.height = fontHeight;
                canvas.id = `canvas-${asciiCode}`;

                card.appendChild(label); card.appendChild(canvas);
                charGrid.appendChild(card);
                updateMiniCanvas(asciiCode);
            }
        }

        function selectChar(asciiCode) {
            if (asciiCode < START_CHAR || asciiCode > END_CHAR) asciiCode = 65;
            document.querySelectorAll('.char-card').forEach(el => el.classList.remove('active'));
            const activeCard = document.getElementById(`char-card-${asciiCode}`);
            if(activeCard) activeCard.classList.add('active');

            currentChar = asciiCode;
            let charStr = asciiCode === 32 ? "SPACE" : asciiCode === 127 ? "DEL" : String.fromCharCode(asciiCode);
            currentCharBadge.innerText = `'${charStr}' (${asciiCode})`;
            renderDrawingGrid();
        }

        function updateMiniCanvas(asciiCode) {
            const canvas = document.getElementById(`canvas-${asciiCode}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const data = fontData[asciiCode - START_CHAR];
            
            ctx.clearRect(0, 0, fontWidth, fontHeight);
            ctx.fillStyle = '#4ade80';
            for(let r = 0; r < fontHeight; r++) {
                for(let c = 0; c < fontWidth; c++) {
                    if(data[r] && data[r][c]) ctx.fillRect(c, r, 1, 1);
                }
            }
        }

        function setupDrawingGrid() {
            updateCellSize(); // Scale to mobile dynamically
            drawingGrid.style.gridTemplateColumns = `repeat(${fontWidth}, 1fr)`;
            drawingGrid.innerHTML = '';

            for(let r = 0; r < fontHeight; r++) {
                for(let c = 0; c < fontWidth; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r; cell.dataset.c = c;
                    
                    // Desktop Listeners
                    cell.addEventListener('mousedown', (e) => {
                        snapshotGlyph();
                        isDrawing = true;
                        const charIdx = currentChar - START_CHAR;
                        drawMode = fontData[charIdx][r][c] === 1 ? 0 : 1;
                        applyDraw(r, c, cell);
                    });
                    cell.addEventListener('mouseenter', (e) => {
                        if(isDrawing) applyDraw(r, c, cell);
                    });

                    // Mobile Touch Listeners (Prevent scroll trigger & start drawing)
                    cell.addEventListener('touchstart', (e) => {
                        e.preventDefault(); 
                        snapshotGlyph();
                        isDrawing = true;
                        const charIdx = currentChar - START_CHAR;
                        drawMode = fontData[charIdx][r][c] === 1 ? 0 : 1;
                        applyDraw(r, c, cell);
                    }, { passive: false });

                    drawingGrid.appendChild(cell);
                }
            }

            // Mobile sliding/drawing event
            drawingGrid.addEventListener('touchmove', (e) => {
                if(!isDrawing) return;
                e.preventDefault(); // Stop page scroll
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if(target && target.classList.contains('cell')) {
                    const tr = parseInt(target.dataset.r);
                    const tc = parseInt(target.dataset.c);
                    applyDraw(tr, tc, target);
                }
            }, { passive: false });

            // Global stops
            window.addEventListener('mouseup', () => { isDrawing = false; });
            window.addEventListener('touchend', () => { isDrawing = false; });
            window.addEventListener('touchcancel', () => { isDrawing = false; });
        }

        function renderDrawingGrid() {
            const charIdx = currentChar - START_CHAR;
            const data = fontData[charIdx];
            const cells = drawingGrid.querySelectorAll('.cell');
            cells.forEach(cell => {
                let r = parseInt(cell.dataset.r);
                let c = parseInt(cell.dataset.c);
                if(data[r] && data[r][c]) cell.classList.add('active');
                else cell.classList.remove('active');
            });
        }

        function applyDraw(r, c, cellElement) {
            const charIdx = currentChar - START_CHAR;
            if(fontData[charIdx][r][c] !== drawMode) {
                fontData[charIdx][r][c] = drawMode;
                if(drawMode) cellElement.classList.add('active');
                else cellElement.classList.remove('active');
                
                updateMiniCanvas(currentChar);
                updateTextPreview();
            }
        }

        testInput.addEventListener('input', updateTextPreview);

        function updateTextPreview() {
            const text = testInput.value;
            const scale = 3, spacing = 1, lineSpacing = 2;
            const lines = text.split('\n');
            let maxChars = 0;
            lines.forEach(l => { if(l.length > maxChars) maxChars = l.length; });

            textPreviewCanvas.width = Math.max(maxChars * (fontWidth + spacing) * scale, 200);
            textPreviewCanvas.height = Math.max(lines.length * (fontHeight + lineSpacing) * scale, 100);

            ctxPreview.clearRect(0, 0, textPreviewCanvas.width, textPreviewCanvas.height);
            ctxPreview.fillStyle = '#4ade80'; 

            let startY = 0;
            lines.forEach(line => {
                let startX = 0;
                for(let i = 0; i < line.length; i++) {
                    let code = line.charCodeAt(i);
                    if(code < START_CHAR || code > END_CHAR) code = 32; 
                    
                    const charData = fontData[code - START_CHAR];
                    if (charData) {
                        for(let r = 0; r < fontHeight; r++) {
                            for(let c = 0; c < fontWidth; c++) {
                                if(charData[r] && charData[r][c]) {
                                    ctxPreview.fillRect(startX + (c * scale), startY + (r * scale), scale, scale);
                                }
                            }
                        }
                    }
                    startX += (fontWidth + spacing) * scale;
                }
                startY += (fontHeight + lineSpacing) * scale;
            });
        }

        // --- Editing helpers: undo, clear, copy, paste, invert ---
        let undoStack = [];
        let glyphClipboard = null;
        const MAX_UNDO = 50;

        function snapshotGlyph() {
            const idx = currentChar - START_CHAR;
            undoStack.push({ idx, data: JSON.parse(JSON.stringify(fontData[idx])) });
            if (undoStack.length > MAX_UNDO) undoStack.shift();
        }

        function refreshCurrentGlyph() {
            renderDrawingGrid();
            updateMiniCanvas(currentChar);
            updateTextPreview();
        }

        function undo() {
            if (!undoStack.length) return;
            const { idx, data } = undoStack.pop();
            fontData[idx] = data;
            if (idx + START_CHAR !== currentChar) selectChar(idx + START_CHAR);
            else refreshCurrentGlyph();
        }

        function clearGlyph() {
            snapshotGlyph();
            const idx = currentChar - START_CHAR;
            fontData[idx] = Array.from({ length: fontHeight }, () => Array(fontWidth).fill(0));
            refreshCurrentGlyph();
        }

        function copyGlyph() {
            const idx = currentChar - START_CHAR;
            glyphClipboard = JSON.parse(JSON.stringify(fontData[idx]));
        }

        function pasteGlyph() {
            if (!glyphClipboard) return;
            snapshotGlyph();
            const idx = currentChar - START_CHAR;
            // Fit clipboard into current dimensions
            fontData[idx] = Array.from({ length: fontHeight }, (_, r) =>
                Array.from({ length: fontWidth }, (_, c) =>
                    (glyphClipboard[r] && glyphClipboard[r][c]) ? 1 : 0));
            refreshCurrentGlyph();
        }

        function invertGlyph() {
            snapshotGlyph();
            const idx = currentChar - START_CHAR;
            for (let r = 0; r < fontHeight; r++)
                for (let c = 0; c < fontWidth; c++)
                    fontData[idx][r][c] = fontData[idx][r][c] ? 0 : 1;
            refreshCurrentGlyph();
        }

        // Keyboard shortcut: Ctrl/Cmd+Z to undo
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (document.activeElement.tagName !== 'TEXTAREA' &&
                    document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    undo();
                }
            }
        });

        function saveProject() {
            const projectData = { width: fontWidth, height: fontHeight, extended: extendedAsciiToggle.checked, data: fontData };
            const blob = new Blob([JSON.stringify(projectData)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `pixel_font_${fontWidth}x${fontHeight}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function loadProject(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const project = JSON.parse(e.target.result);
                    if (project.width && project.height && project.data) {
                        fontWidth = project.width; fontHeight = project.height; fontData = project.data;
                        extendedAsciiToggle.checked = project.extended !== undefined ? project.extended : (fontData.length > 95);
                        document.getElementById('fontWidth').value = fontWidth;
                        document.getElementById('fontHeight').value = fontHeight;
                        initFont(); // Recalculate parameters
                    } else alert("Invalid project file format.");
                } catch (err) { alert("Error reading file."); }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function exportToTtf() {
            if (typeof opentype === 'undefined') { alert("OpenType.js library is loading. Ensure you have an internet connection."); return; }
            const scale = 100;
            const glyphs = [new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: fontWidth * scale, path: new opentype.Path() })];

            for (let i = 0; i < NUM_CHARS; i++) {
                let asciiCode = i + START_CHAR;
                let charData = fontData[i];
                let path = new opentype.Path();

                for (let r = 0; r < fontHeight; r++) {
                    for (let c = 0; c < fontWidth; c++) {
                        if (charData && charData[r] && charData[r][c]) {
                            let x = c * scale; let y = (fontHeight - 1 - r) * scale; 
                            path.moveTo(x, y); path.lineTo(x, y + scale); path.lineTo(x + scale, y + scale); path.lineTo(x + scale, y); path.close();
                        }
                    }
                }
                glyphs.push(new opentype.Glyph({ name: String.fromCharCode(asciiCode), unicode: asciiCode, advanceWidth: (fontWidth + 1) * scale, path: path }));
            }
            new opentype.Font({ familyName: `Pixel Font ${fontWidth}x${fontHeight}`, styleName: 'Regular', unitsPerEm: fontHeight * scale, ascender: fontHeight * scale, descender: 0, glyphs: glyphs }).download(`pixel_font_${fontWidth}x${fontHeight}.ttf`);
        }

        function exportToCpp() {
            let dataType = "uint8_t"; if (fontWidth > 8) dataType = "uint16_t"; if (fontWidth > 16) dataType = "uint32_t";
            let cpp = `// Custom ${fontWidth}x${fontHeight} Pixel Font\n#ifndef CUSTOM_FONT_H\n#define CUSTOM_FONT_H\n\n#include <stdint.h>\n\nconst int FONT_WIDTH = ${fontWidth};\nconst int FONT_HEIGHT = ${fontHeight};\nconst int FONT_START_CHAR = ${START_CHAR};\nconst int FONT_END_CHAR = ${END_CHAR};\n\nconst ${dataType} custom_font[${NUM_CHARS}][${fontHeight}] = {\n`;
            for(let i = 0; i < NUM_CHARS; i++) {
                let asciiCode = i + START_CHAR;
                let charStr = asciiCode === 92 ? "'\\\\'" : asciiCode === 34 ? "'\\\"'" : asciiCode === 32 ? "SPACE" : asciiCode === 127 ? "DEL" : `'${String.fromCharCode(asciiCode)}'`;
                cpp += `  { // ${asciiCode} ${charStr}\n`;
                for(let r = 0; r < fontHeight; r++) {
                    let rowVal = 0;
                    for(let c = 0; c < fontWidth; c++) if (fontData[i][r][c]) rowVal |= (1 << (fontWidth - 1 - c));
                    cpp += `    0x${rowVal.toString(16).toUpperCase().padStart(fontWidth > 16 ? 8 : (fontWidth > 8 ? 4 : 2), '0')}, `;
                }
                cpp += `\n  },\n`;
            }
            cpp += `};\n#endif // CUSTOM_FONT_H\n`;
            downloadFile(cpp, `font_${fontWidth}x${fontHeight}.h`, 'text/plain');
        }

        function exportToBdf() {
            let bdf = `STARTFONT 2.1\nFONT -custom-font-medium-r-normal--${fontHeight}-${fontHeight}0-75-75-c-${fontWidth}0-iso10646-1\nSIZE ${fontHeight} 75 75\nFONTBOUNDINGBOX ${fontWidth} ${fontHeight} 0 0\nSTARTPROPERTIES 2\nFONT_ASCENT ${fontHeight}\nFONT_DESCENT 0\nENDPROPERTIES\nCHARS ${NUM_CHARS}\n`;
            const bytesPerRow = Math.ceil(fontWidth / 8);
            for (let i = 0; i < NUM_CHARS; i++) {
                let asciiCode = i + START_CHAR;
                bdf += `STARTCHAR U+${asciiCode.toString(16).toUpperCase().padStart(4, '0')}\nENCODING ${asciiCode}\nSWIDTH ${fontWidth * 10} 0\nDWIDTH ${fontWidth} 0\nBBX ${fontWidth} ${fontHeight} 0 0\nBITMAP\n`;
                for (let r = 0; r < fontHeight; r++) {
                    let rowHex = "";
                    for (let b = 0; b < bytesPerRow; b++) {
                        let byteVal = 0;
                        for (let bit = 0; bit < 8; bit++) {
                            let c = b * 8 + bit; if (c < fontWidth && fontData[i][r][c]) byteVal |= (1 << (7 - bit));
                        }
                        rowHex += byteVal.toString(16).toUpperCase().padStart(2, '0');
                    }
                    bdf += `${rowHex}\n`;
                }
                bdf += `ENDCHAR\n`;
            }
            bdf += `ENDFONT\n`;
            downloadFile(bdf, `font_${fontWidth}x${fontHeight}.bdf`, 'text/plain');
        }

        function exportToPsf() {
            const HEADER_SIZE = 32, totalGlyphs = END_CHAR + 1; 
            const bytesPerRow = Math.ceil(fontWidth / 8), bytesPerGlyph = fontHeight * bytesPerRow;
            const buffer = new Uint8Array(HEADER_SIZE + (totalGlyphs * bytesPerGlyph));
            const dv = new DataView(buffer.buffer);
            buffer.set([0x72, 0xb5, 0x4a, 0x86], 0);
            dv.setUint32(4, 0, true); dv.setUint32(8, HEADER_SIZE, true); dv.setUint32(12, 0, true);
            dv.setUint32(16, totalGlyphs, true); dv.setUint32(20, bytesPerGlyph, true);
            dv.setUint32(24, fontHeight, true); dv.setUint32(28, fontWidth, true);
            
            let offset = HEADER_SIZE;
            for (let asciiCode = 0; asciiCode <= END_CHAR; asciiCode++) {
                let dataIdx = asciiCode - START_CHAR;
                let hasData = (dataIdx >= 0 && dataIdx < NUM_CHARS && fontData[dataIdx]);
                for (let r = 0; r < fontHeight; r++) {
                    for (let b = 0; b < bytesPerRow; b++) {
                        let byteVal = 0;
                        for (let bit = 0; bit < 8; bit++) {
                            let c = b * 8 + bit; if (c < fontWidth && hasData && fontData[dataIdx][r][c]) byteVal |= (1 << (7 - bit));
                        }
                        buffer[offset++] = byteVal;
                    }
                }
            }
            downloadFile(buffer, `font_${fontWidth}x${fontHeight}.psf`, 'application/octet-stream');
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        window.onload = initFont;
    </script>
</body>
</html>
